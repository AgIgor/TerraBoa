<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d2a14">
  <title>Terra Boa</title>
  <link rel="stylesheet" href="style.css?v=657ada29">
</head>
<body>
  <div id="game"></div>

  <header id="hud">
    <div class="brand">Terra<b>Boa</b></div>
    <div class="stat"><small>Caixa</small><span id="money">R$ 0</span></div>
    <div class="stat"><small id="season">Primavera</small><span id="date">Set · dia 1</span></div>
    <div class="stat"><small>Hora</small><span id="clock">06:00</span></div>
    <button class="stat click" id="wxBtn" title="Previsão do tempo (T)"><small id="wxLabel">Tempo</small><span id="wx">☀️ 22°</span></button>
    <div class="speeds" id="speeds">
      <button data-speed="0" title="Pausar (P)">❚❚</button>
      <button data-speed="1" class="on" title="Normal">▶</button>
      <button data-speed="2" title="Rápido">▶▶</button>
      <button data-speed="4" title="Muito rápido">▶▶▶</button>
    </div>
  </header>

  <nav id="menu">
    <button id="mktBtn" title="Mercado (M)"><span>💰</span><em>Mercado</em></button>
    <button id="farmBtn" title="Fazenda (F)"><span>🐄</span><em>Fazenda</em></button>
    <button id="invBtn" title="Estoque (I)"><span>🎒</span><em>Estoque</em></button>
    <button id="layerBtn" title="Mapas do solo (L)"><span>🗺️</span><em id="layerLabel">Solo</em></button>
    <button id="soundBtn" title="Som liga/desliga"><span>🔊</span><em>Som</em></button>
    <button id="helpBtn" title="Ajuda e opções (H)"><span>☰</span><em>Menu</em></button>
  </nav>

  <aside id="inv"></aside>
  <div id="toasts"></div>
  <div id="tip"></div>

  <div id="subbar"></div>
  <footer id="hotbar"></footer>
  <div id="water"><i></i></div>

  <div id="joy"><i></i></div>
  <div id="touchBtns">
    <button id="tUse">Usar</button>
    <button id="tHand">Mão</button>
    <button id="tMount">Montar</button>
  </div>

  <div id="title" class="hidden">
    <div class="tcard">
      <div class="tlogo">Terra<b>Boa</b></div>
      <p class="tsub">Uma fazenda no cerrado: pasto, lavoura, criação, clima e mercado de verdade.</p>
      <div id="tBody"></div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="sheet">
      <header><h2 id="mTitle"></h2><button id="mClose" title="Fechar (Esc)">✕</button></header>
      <nav id="mTabs"></nav>
      <div id="mBody"></div>
    </div>
  </div>

    "./src/game.js": "./src/game.js?v=aaff849e",
    "./src/main.js": "./src/main.js?v=559cbc8a",
    "./src/market.js": "./src/market.js?v=7c3c4e31",
    "./src/net.js": "./src/net.js?v=fe20e4c8",

}

  <script type="module" src="src/main.js?v=559cbc8a"></script>
</body>
</html>
